<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You & Me Forever ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #040108;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="infinityCanvas"></canvas>

    <script>
        const canvas = document.getElementById('infinityCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Infinity Lemniscate Math Equation (∞ Shape)
        function getInfinityPoint(t) {
            // Scale according to screen width/height
            const scale = Math.min(canvas.width, canvas.height) / 3.2;
            const a = scale;
            
            // Parametric Lemniscate Formula
            const denominator = 1 + Math.sin(t) * Math.sin(t);
            const x = (a * Math.cos(t)) / denominator;
            const y = (a * Math.sin(t) * Math.cos(t)) / denominator;

            return {
                x: canvas.width / 2 + x,
                y: canvas.height / 2 + y
            };
        }

        // Configuration
        const textList = ["YOU & ME", "FOREVER", "LOVE YOU", "TOGETHER", "ALWAYS"];
        const totalItems = 70; // Infinity loop par kitne text elements honge
        let offset = 0; // Speed flow counter

        function drawInfinityLoop() {
            // Dark trail background for motion blur
            ctx.fillStyle = 'rgba(4, 1, 8, 0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Flow speed increase
            offset += 0.007;

            for (let i = 0; i < totalItems; i++) {
                // Loop ke around position (0 to 2*PI)
                const progress = (i / totalItems) * Math.PI * 2 + offset;
                const point = getInfinityPoint(progress);

                // Words pick karna sequence me
                const text = textList[i % textList.length];

                // Dynamic Glowing Colors (Crimson Red to Neon Pink)
                const redIntensity = Math.floor(190 + Math.sin(progress * 2) * 65);
                const color = `rgb(${redIntensity}, 15, 60)`;

                ctx.save();
                ctx.translate(point.x, point.y);

                // Text Styling & Red Glow
                ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = color;
                ctx.shadowColor = '#ff0044';
                ctx.shadowBlur = 12;

                ctx.fillText(text, 0, 0);

                ctx.restore();
            }

            requestAnimationFrame(drawInfinityLoop);
        }

        // Start Animation
        drawInfinityLoop();
    </script>
</body>
</html>
